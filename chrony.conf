# https://chrony-project.org/doc/latest/chrony.conf.html

pool time.cloudflare.com iburst nts   # with NTS TLS cryptographic
pool time.euro.apple.com iburst.      # without NTS
driftfile /var/lib/chrony/drift
makestep 1.0 5
rtcsync

# server settings :
noclientlog            
bindcmdaddress 0.0.0.0
# bindcmdaddress ::    # IPv6 disabled

# port 9123            # if not using default port 123 
allow all
# allow 192.168.0.0/24
# deny 10.67/16
ratelimit interval 2 burst 16
