<!DOCTYPE html>
<html>
  <head>
    <title>Waiting for data...</title>
    <meta http-equiv="refresh" content="30">
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios/100/hourglass.png"><style>
      body { 
        background-color: #757575; 
        text-align: center; 
        padding: 150px; }
      h1 { 
        font-size: 50px; }
      body { 
        font: 20px Helvetica, sans-serif; color: #fff; 
      }
      #img360 {
        border-radius: 100px;
        margin-left: 0px;
        -webkit-animation:spin 4s linear infinite;
        -moz-animation:spin 4s linear infinite;
        animation:spin 4s linear infinite;
      }
      @-moz-keyframes spin { 100% { -moz-transform: rotate(360deg); } }
      @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
      @keyframes spin { 100% { -webkit-transform: rotate(360deg); transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <img width="100" height="100" src="https://img.icons8.com/ios/100/hourglass.png" alt="hourglass"/>   
    <h1>Statistics not yet collected.</h1>
    <h2>Data is available within 10 min.</h2>
  </body>
</html>
